<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Steps | Tracker Dashboard</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root {
            --bg-black: #07070a;
            --glass: rgba(18, 18, 20, 0.85);
            --glass-strong: rgba(255, 255, 255, 0.05);
            --stroke: rgba(255, 255, 255, 0.1);
            --accent-orange: #ff8c00;
            --text: #ffffff;
            --brand-gradient: linear-gradient(90deg, #ff00ff 0%, #ff8c00 100%);
        }

        body, html { 
            margin: 0; padding: 0; height: 100%; width: 100%;
            background: var(--bg-black); color: var(--text); 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
        }

        #map { position: absolute; top: 0; bottom: 0; width: 100%; z-index: 1; }

        header {
            position: absolute; top: 20px; left: 20px; right: 20px;
            z-index: 1000; display: flex; justify-content: space-between; align-items: center;
        }

        h1 { 
            margin: 0; font-weight: 900; font-size: 18px; 
            background: var(--brand-gradient);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            text-transform: uppercase;
        }

        #controls {
            position: absolute; bottom: 20px; left: 10px; right: 10px;
            z-index: 1000; background: var(--glass);
            backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--stroke); border-radius: 24px;
            padding: 18px; box-sizing: border-box;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }

        .stat-row { display: flex; justify-content: space-between; margin-bottom: 12px; gap: 8px; }
        .stat-card { flex: 1; background: var(--glass-strong); padding: 10px; border-radius: 14px; border: 1px solid var(--stroke); text-align: center; }
        .stat-label { font-size: 8px; text-transform: uppercase; opacity: 0.5; font-weight: 700; margin-bottom: 2px; letter-spacing: 0.5px; }
        .stat-val { font-size: 14px; font-weight: 800; color: var(--accent-orange); white-space: nowrap; }

        .date-row { display: flex; gap: 12px; margin-bottom: 12px; align-items: center; }
        .date-input {
            flex: 1; background: var(--glass-strong); border: 1px solid var(--stroke);
            color: white; padding: 10px; border-radius: 12px; font-size: 12px;
            font-family: inherit; outline: none;
        }

        .unit-toggle {
            background: var(--glass-strong); border: 1px solid var(--stroke);
            color: white; padding: 8px 12px; border-radius: 12px; font-size: 10px;
            font-weight: 800; cursor: pointer; text-transform: uppercase; min-width: 60px;
        }

        .range-wrapper { position: relative; width: 100%; height: 30px; margin-bottom: 10px; }
        .dual-range {
            position: absolute; width: 100%; pointer-events: none;
            appearance: none; height: 100%; background: none; outline: none; z-index: 2;
        }
        .dual-range::-webkit-slider-thumb {
            pointer-events: auto; appearance: none; width: 22px; height: 22px;
            border-radius: 50%; background: #fff; border: 3px solid var(--accent-orange);
        }
        .slider-track {
            position: absolute; width: 100%; height: 4px; top: 13px;
            background: rgba(255,255,255,0.1); border-radius: 2px; z-index: 1;
        }

        .playback-btn {
            width: 100%; padding: 14px; background: var(--brand-gradient);
            border: none; border-radius: 14px; color: white; font-weight: 800;
            text-transform: uppercase; font-size: 13px; cursor: pointer;
        }

        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body>

    <header>
        <h1>Steps Tracker</h1>
        <div style="font-size: 10px; font-weight: bold; color: #4caf50;">● LIVE</div>
    </header>

    <div id="map"></div>

    <section id="controls">
        <div class="stat-row">
            <div class="stat-card">
                <div class="stat-label">Active Time</div>
                <div class="stat-val" id="timeCount">00h 00m 00s</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Steps</div>
                <div class="stat-val" id="stepCount">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Distance</div>
                <div class="stat-val" id="distCount">0.00 km</div>
            </div>
        </div>

        <div class="date-row">
            <input type="date" id="startDate" class="date-input" onchange="processAndRenderData()">
            <button class="unit-toggle" id="unitToggle" onclick="toggleUnits()">KM</button>
            <input type="date" id="endDate" class="date-input" onchange="processAndRenderData()">
        </div>

        <div class="range-wrapper">
            <div class="slider-track"></div>
            <input type="range" id="fromSlider" class="dual-range" min="0" max="1000" value="0" oninput="syncFromSlider()">
            <input type="range" id="toSlider" class="dual-range" min="0" max="1000" value="1000" oninput="syncFromSlider()">
        </div>

        <button class="playback-btn" onclick="animateHistory()">Play Sequence</button>
    </section>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const API_URL = 'https://tracker-nx8a.onrender.com/api/routes'; 
        const map = L.map('map', { zoomControl: false, attributionControl: false }).setView([50.922, -1.396], 15);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(map);

        let masterData = [];
        let polylineLayerGroup = L.layerGroup().addTo(map);
        let currentUnit = 'KM';

        const today = new Date();
        const startOfHistory = new Date("2026-05-01");
        document.getElementById('startDate').valueAsDate = startOfHistory;
        document.getElementById('endDate').valueAsDate = today;

        function toggleUnits() {
            currentUnit = currentUnit === 'KM' ? 'MI' : 'KM';
            document.getElementById('unitToggle').innerText = currentUnit;
            processAndRenderData();
        }

        function syncFromSlider() {
            let f = parseInt(document.getElementById('fromSlider').value);
            let t = parseInt(document.getElementById('toSlider').value);
            if (f > t) { document.getElementById('fromSlider').value = t; f = t; }
            
            const range = today - startOfHistory;
            document.getElementById('startDate').valueAsDate = new Date(startOfHistory.getTime() + (range * (f / 1000)));
            document.getElementById('endDate').valueAsDate = new Date(startOfHistory.getTime() + (range * (t / 1000)));
            processAndRenderData();
        }

        async function fetchRoutes() {
            let sessionKey = sessionStorage.getItem('tracker_api_key');
            const urlParams = new URLSearchParams(window.location.search);
            const urlKey = urlParams.get('key');

            if (urlKey) { sessionKey = urlKey; sessionStorage.setItem('tracker_api_key', urlKey); }
            if (!sessionKey) {
                sessionKey = prompt("Enter Dashboard Password:");
                if (!sessionKey) return; 
                sessionStorage.setItem('tracker_api_key', sessionKey);
            }

            try {
                const response = await fetch(API_URL, { headers: { 'x-api-key': sessionKey } });
                if (!response.ok) {
                    sessionStorage.removeItem('tracker_api_key');
                    return;
                }
                masterData = await response.json();
                processAndRenderData();
            } catch (e) { console.error(e); }
        }

        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371; 
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLon / 2) * Math.sin(dLon / 2);
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
        }

        function processAndRenderData() {
            if (masterData.length === 0) return;
            polylineLayerGroup.clearLayers();

            const sD = new Date(document.getElementById('startDate').value);
            const eD = new Date(document.getElementById('endDate').value);
            eD.setHours(23, 59, 59);

            let totalDistKm = 0;
            
            let activePoints = masterData.filter(p => {
                const pD = new Date(p.timestamp);
                return pD >= sD && pD <= eD;
            });

            if (activePoints.length > 0) {
                // Time calculation: 00h 00m 00s
                const durationMs = new Date(activePoints[activePoints.length-1].timestamp) - new Date(activePoints[0].timestamp);
                const hrs = Math.floor(durationMs / 3600000);
                const mins = Math.floor((durationMs % 3600000) / 60000);
                const secs = Math.floor((durationMs % 60000) / 1000);
                document.getElementById('timeCount').innerText = 
                    `${hrs.toString().padStart(2, '0')}h ${mins.toString().padStart(2, '0')}m ${secs.toString().padStart(2, '0')}s`;

                // Steps calculation: Diff between first and last point in visible range
                const startSteps = activePoints[0].steps || 0;
                const endSteps = activePoints[activePoints.length - 1].steps || 0;
                const visibleSteps = Math.max(0, endSteps - startSteps);
                document.getElementById('stepCount').innerText = visibleSteps.toLocaleString();

                // Distance and Polyline
                let currentWalk = [activePoints[0]];
                for (let i = 1; i < activePoints.length; i++) {
                    const prev = activePoints[i-1];
                    const curr = activePoints[i];
                    const timeGap = (new Date(curr.timestamp) - new Date(prev.timestamp)) / 60000;

                    if (timeGap > 20) {
                        drawWalk(currentWalk);
                        currentWalk = [curr];
                    } else {
                        currentWalk.push(curr);
                        totalDistKm += calculateDistance(prev.lat, prev.lng, curr.lat, curr.lng);
                    }
                }
                drawWalk(currentWalk);
            } else {
                document.getElementById('timeCount').innerText = "00h 00m 00s";
                document.getElementById('stepCount').innerText = "0";
            }

            // Display Distance
            const displayDist = currentUnit === 'KM' ? totalDistKm : totalDistKm * 0.621371;
            document.getElementById('distCount').innerText = `${displayDist.toFixed(2)} ${currentUnit.toLowerCase()}`;
        }

        function drawWalk(walk) {
            if (walk.length < 2) return;
            L.polyline(walk.map(p => [p.lat, p.lng]), { 
                color: '#ff8c00', weight: 4, opacity: 0.8, lineCap: 'round'
            }).addTo(polylineLayerGroup);
        }

        function animateHistory() {
            let val = 0;
            const int = setInterval(() => {
                val += 5;
                document.getElementById('toSlider').value = val;
                syncFromSlider();
                if (val >= 1000) clearInterval(int);
            }, 30);
        }

        fetchRoutes();
        setInterval(fetchRoutes, 30000);
    </script>
</body>
</html>
