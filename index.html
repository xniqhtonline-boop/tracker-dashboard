<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Steps | Tracker Dashboard</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        :root {
            --bg-black: #07070a;
            --glass: rgba(18, 18, 20, 0.8);
            --glass-strong: rgba(255, 255, 255, 0.05);
            --stroke: rgba(255, 255, 255, 0.1);
            --accent-orange: #ff8c00;
            --text: #ffffff;
            --brand-gradient: linear-gradient(90deg, #ff00ff 0%, #ff8c00 100%);
        }

        body, html { 
            margin: 0; padding: 0; height: 100%; width: 100%;
            background: var(--bg-black); color: var(--text); 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
        }

        #map { 
            position: absolute; top: 0; bottom: 0; width: 100%; z-index: 1; 
        }

        /* Responsive Mobile Header */
        header {
            position: absolute; top: 20px; left: 20px; right: 20px;
            z-index: 1000; display: flex; justify-content: space-between; align-items: center;
        }

        h1 { 
            margin: 0; font-weight: 900; font-size: 20px; letter-spacing: -0.5px;
            background: var(--brand-gradient);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            text-transform: uppercase;
        }

        /* Glassmorphic Bottom Panel */
        #controls {
            position: absolute; bottom: 25px; left: 15px; right: 15px;
            z-index: 1000; background: var(--glass);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--stroke); border-radius: 24px;
            padding: 20px; box-sizing: border-box;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }

        .stat-row { display: flex; justify-content: space-between; margin-bottom: 20px; gap: 10px; }
        .stat-card { flex: 1; background: var(--glass-strong); padding: 12px; border-radius: 16px; border: 1px solid var(--stroke); }
        .stat-label { font-size: 10px; text-transform: uppercase; opacity: 0.5; margin-bottom: 4px; font-weight: 700; }
        .stat-val { font-size: 18px; font-weight: 800; color: var(--accent-orange); }

        /* Custom Slider Styling */
        .range-wrapper { position: relative; width: 100%; height: 30px; margin: 10px 0; }
        .dual-range {
            position: absolute; width: 100%; pointer-events: none;
            appearance: none; height: 100%; background: none; outline: none; z-index: 2;
        }
        .dual-range::-webkit-slider-thumb {
            pointer-events: auto; appearance: none; width: 24px; height: 24px;
            border-radius: 50%; background: #fff; border: 3px solid var(--accent-orange);
        }
        .slider-track {
            position: absolute; width: 100%; height: 4px; top: 13px;
            background: rgba(255,255,255,0.1); border-radius: 2px; z-index: 1;
        }

        .playback-btn {
            width: 100%; padding: 14px; background: var(--brand-gradient);
            border: none; border-radius: 14px; color: white; font-weight: 800;
            text-transform: uppercase; font-size: 13px; margin-top: 10px;
        }

        /* Hide Scrollbar for clean UI */
        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body>

    <header>
        <h1>Steps Tracker</h1>
        <div id="active-status" style="font-size: 10px; font-weight: bold; color: #4caf50;">● LIVE</div>
    </header>

    <div id="map"></div>

    <section id="controls">
        <div class="stat-row">
            <div class="stat-card">
                <div class="stat-label">Total Steps</div>
                <div class="stat-val" id="stepCount">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Energy</div>
                <div class="stat-val" id="calCount">0 kcal</div>
            </div>
        </div>

        <div class="range-wrapper">
            <div class="slider-track"></div>
            <input type="range" id="fromSlider" class="dual-range" min="0" max="1000" value="0" oninput="syncFromSlider()">
            <input type="range" id="toSlider" class="dual-range" min="0" max="1000" value="1000" oninput="syncFromSlider()">
        </div>

        <button class="playback-btn" onclick="animateHistory()">Play Sequence</button>

        <div style="display:none;">
            <input type="date" id="startDate">
            <input type="date" id="endDate">
        </div>
    </section>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.heat/dist/leaflet-heat.js"></script>

    <script>
        const API_URL = 'https://tracker-nx8a.onrender.com/api/routes'; 
        const WEIGHT_KG = 75; 
        const pathColours = ['#ff00ff', '#ff8c00', '#46f0f0', '#3cb44b']; 

        const map = L.map('map', { zoomControl: false, attributionControl: false }).setView([50.92, -1.39], 14);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(map);

        let masterData = [];
        let polylineLayerGroup = L.layerGroup().addTo(map);

        const today = new Date();
        const startOfHistory = new Date("2026-05-01");
        document.getElementById('startDate').valueAsDate = startOfHistory;
        document.getElementById('endDate').valueAsDate = today;

        function syncFromSlider() {
            let f = parseInt(document.getElementById('fromSlider').value);
            let t = parseInt(document.getElementById('toSlider').value);
            if (f > t) { document.getElementById('fromSlider').value = t; f = t; }
            
            const range = today - startOfHistory;
            document.getElementById('startDate').valueAsDate = new Date(startOfHistory.getTime() + (range * (f / 1000)));
            document.getElementById('endDate').valueAsDate = new Date(startOfHistory.getTime() + (range * (t / 1000)));
            processAndRenderData();
        }

        async function fetchRoutes() {
            try {
                const response = await fetch(API_URL);
                masterData = await response.json();
                processAndRenderData();
            } catch (e) { console.error(e); }
        }

        function processAndRenderData() {
            if (masterData.length === 0) return;
            polylineLayerGroup.clearLayers();

            const sD = new Date(document.getElementById('startDate').value);
            const eD = new Date(document.getElementById('endDate').value);
            eD.setHours(23, 59, 59);

            let currentWalk = [];
            let totalSteps = 0;

            masterData.forEach((point, i) => {
                const pD = new Date(point.timestamp);
                if (pD >= sD && pD <= eD) {
                    if (currentWalk.length > 0) {
                        const lastD = new Date(currentWalk[currentWalk.length - 1].timestamp);
                        if ((pD - lastD) / 60000 > 30) {
                            drawWalk(currentWalk);
                            totalSteps += currentWalk[currentWalk.length-1].steps || 0;
                            currentWalk = [];
                        }
                    }
                    currentWalk.push(point);
                }
            });
            if (currentWalk.length > 0) {
                drawWalk(currentWalk);
                totalSteps += currentWalk[currentWalk.length-1].steps || 0;
            }

            document.getElementById('stepCount').innerText = totalSteps.toLocaleString();
            document.getElementById('calCount').innerText = Math.round(totalSteps * 0.04 * (WEIGHT_KG / 70)) + " kcal";
        }

        function drawWalk(walk) {
            L.polyline(walk.map(p => [p.lat, p.lng]), { 
                color: '#ff8c00', 
                weight: 5, 
                opacity: 0.8,
                lineCap: 'round'
            }).addTo(polylineLayerGroup);
        }

        function animateHistory() {
            let val = 0;
            const int = setInterval(() => {
                val += 10;
                document.getElementById('toSlider').value = val;
                syncFromSlider();
                if (val >= 1000) clearInterval(int);
            }, 30);
        }

        fetchRoutes();
    </script>
</body>
</html>
